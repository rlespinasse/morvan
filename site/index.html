<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas — Parc naturel régional du Morvan</title>
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#2d6b3f" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      #map {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="module" src="/src/main.js"></script>
    <!-- Mesure d'audience GoatCounter (compte « rlespinasse »), respectueuse de
       la vie privée : pas de cookies, pas de données personnelles, adresses IP
       publiques non stockées. Les événements applicatifs additionnels sont
       émis via src/analytics.js (cf. initAnalytics/trackEvent), préfixés par
       « /morvan/ ». Les hits depuis localhost / réseaux privés sont ignorés
       par défaut par count.js (allow_local non activé). -->
    <script
      data-goatcounter="https://rlespinasse.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </body>
</html>
